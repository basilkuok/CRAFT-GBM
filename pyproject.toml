[build-system]
requires = ["setuptools>=77"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "craft-gbm"
version = "1.1.0.dev0"
description = "CRAFT-GBM research interface for the native LightGBM extension"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["dependencies"]

[project.urls]
Repository = "https://github.com/basilkuok/CRAFT-GBM"
Paper = "https://arxiv.org/abs/2611.11914"

[tool.setuptools]
package-dir = {"" = "python-package"}
packages = ["lightgbm"]
include-package-data = false

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
